  services:
    stats-server:
      build: ewm-stats/server
      image: stats-server
      container_name: stats-server
      ports:
        - "9090:9090"
      depends_on:
        - stats-db
      environment:
        - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/stats_db
        - SPRING_DATASOURCE_USERNAME=postgres
        - SPRING_DATASOURCE_PASSWORD=postgres

    stats-db:
      image: postgres:16.1
      container_name: stats-db
      ports:
        - "5432:5432"
      environment:
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_USER=postgres
        - POSTGRES_DB=stats_db
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 10s
        timeout: 5s
        retries: 5

    ewm-service:
      build: ewm-main
      image: ewm-main
      container_name: ewm-main
      ports:
        - "8080:8080"
      depends_on:
        - ewm-db
        - stats-server
      environment:
        - SPRING_DATASOURCE_URL=jdbc:postgresql://ewm-db:5432/main_db
        - SPRING_DATASOURCE_USERNAME=postgres
        - SPRING_DATASOURCE_PASSWORD=postgres
        - STATS_SERVER_URL=http://stats-server:9090

    ewm-db:
      image: postgres:16.1
      container_name: ewm-db
      ports:
        - "6542:5432"
      environment:
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_USER=postgres
        - POSTGRES_DB=main_db
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 10s
        timeout: 5s
        retries: 5
